<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GDS 5대 확신 암송 퀴즈</title>
<meta name="description" content="순복음대구교회 GDS실 스탭을 위한 5대 확신 성경 암송 퀴즈 (개역개정)" />
<meta name="theme-color" content="#1b3a5c" />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">GDS</span>
    <span class="brand-text">5대 확신 암송</span>
  </div>
  <span class="version">개역개정</span>
</header>

<main class="wrap">

  <!-- 홈 -->
  <section id="homeScreen">
    <div class="card hero">
      <h1>5대 확신</h1>
      <p class="lead">순복음대구교회 GDS실 스탭 암송 점검</p>
      <p class="desc">확신마다 <strong>① 성경 구절</strong>을 먼저 입력하고,<br />이어서 <strong>② 말씀 본문</strong>을 입력합니다.<br />틀린 부분을 어절 단위로 표시해 드립니다.</p>
      <button id="startAllBtn" class="btn primary big">1번부터 순서대로 시작</button>
    </div>

    <div class="card">
      <p class="card-title">확신 하나만 연습하기</p>
      <ul id="verseList" class="verse-list"></ul>
    </div>

    <div id="history" class="card history"></div>
  </section>

  <!-- 퀴즈 -->
  <section id="quizScreen" hidden>
    <div class="progress">
      <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
      <span id="progressText" class="progress-text"></span>
    </div>
    <div class="card quiz-card">
      <h2 id="quizTitle" class="quiz-title"></h2>
      <div id="stage"></div>
    </div>
    <button id="homeBtn" class="btn link">처음으로</button>
  </section>

  <!-- 결과 -->
  <section id="resultScreen" hidden>
    <div class="card">
      <h2 class="quiz-title">전체 결과</h2>
      <div id="resultSummary" class="summary"></div>
      <div id="resultTable" class="result-table"></div>
      <div class="btn-row">
        <button id="resultHomeBtn" class="btn ghost">처음으로</button>
        <button id="againBtn" class="btn primary">다시 도전</button>
      </div>
    </div>
  </section>

</main>

<footer class="foot">순복음대구교회 GDS실 · 개역개정 성경</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
